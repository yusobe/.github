name: Task
description: A single piece of work — a change, a chore, or an investigation.
type: Task
body:
  - type: input
    id: notion
    attributes:
      label: Notion page
      description: >
        Link to the Notion page for this work, if there is one. Paste the full URL —
        it will show near the top of the issue.
      placeholder: "https://app.notion.com/p/..."
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Context
      description: What needs doing and why.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How we know it's done. One line per criterion.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: input
    id: parent
    attributes:
      label: Parent initiative
      description: Issue number or URL of the initiative this belongs to, if any.

  - type: textarea
    id: blocked-by
    attributes:
      label: Blocked by
      description: >
        Anything outside this issue that has to happen first. For another issue,
        use the Relationships panel after creating. For an external blocker
        (a DSO, a vendor, another team), describe it here.

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Links, constraints, prior attempts.
